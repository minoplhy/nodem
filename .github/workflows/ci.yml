name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for frontend dist needed in tests/embed)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Verify Installer Scripts Dry Run
        run: |
          ./install.sh --dry-run
          ./uninstall.sh --dry-run
          ./install-agent.sh --dry-run
          ./uninstall-agent.sh --dry-run

  test-frontend:
    name: Test Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Lint/Build
        run: |
          cd frontend
          npm ci
          npm run build
