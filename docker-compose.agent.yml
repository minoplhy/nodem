services:
  nodem_agent:
    image: ghcr.io/minoplhy/nodem-agent:latest
    container_name: nodem_agent
    restart: unless-stopped
    # Loads configuration directly from .env.agent (or custom file via ENV_FILE)
    env_file:
      - ${ENV_FILE:-.env.agent}
    volumes:
      # Staging directory where ECH configs and PEM keys are written.
      # Mount this to your reverse proxy's config/certs directory or shared volume.
      - ./agent_data:/opt/ech
    extra_hosts:
      # Allows reaching host-bound services from within the container on Linux
      - "host.docker.internal:host-gateway"
